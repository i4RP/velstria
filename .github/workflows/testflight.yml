name: TestFlight

# production 以外のすべてのブランチへの push で、アーカイブして TestFlight（内部テスト）へ配信する。
# 内部テストグループ「In」は全ビルド自動配信なので、Apple の処理完了後にテスターへ届く。
# 「テスト内容」にブランチ名とコミットが入るので、どのブランチのビルドか TestFlight で見分けられる。
# 中身は build-upload.yml（production.yml と共通）。フォーク・プルリクエストでは動かない（Secrets はフォークに渡らない）。
on:
  push:
    branches-ignore: [production]
    paths: ["VELSTRIA/**", ".github/workflows/**"]
  workflow_dispatch:

# ブランチごとに 1 本ずつ（同じブランチの待機中の実行は新しい push で置き換わる）。ブランチ間は並行に走る
concurrency:
  group: testflight-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  testflight:
    uses: ./.github/workflows/build-upload.yml
    with:
      lane: beta
    secrets: inherit
