name: Build & Upload

# testflight.yml（内部テスト）と production.yml（App Store 審査提出）から呼ばれる共通ジョブ。
# テスト → アーカイブ（手動署名）→ App Store Connect へアップロード → 処理完了待ち →
# TestFlight の「テスト内容」にブランチ・コミットを記入 →（production のみ）審査に提出。
#
# 必要な Secrets（呼び出し側から secrets: inherit で渡す）:
#   ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8   App Store Connect API キー（アップロード・ビルド状態・提出）
#   CI_DIST_P12_BASE64 / CI_DIST_P12_PASSWORD  CI 専用の配布証明書（Apple Distribution）と秘密鍵
#   CI_PROFILE_BASE64                         App Store プロビジョニングプロファイル「VELSTRIA AppStore CI」
# 任意の Variables: ASC_RELEASE_TYPE = AFTER_APPROVAL（既定: 承認後すぐ公開）/ MANUAL（承認後に手動で公開）
on:
  workflow_call:
    inputs:
      lane:
        description: "beta（内部テスト）または production（審査提出）"
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.lane == 'production' && 'App Store 提出' || 'TestFlight 配信' }}
    runs-on: macos-26
    timeout-minutes: 150
    defaults:
      run:
        working-directory: VELSTRIA
    env:
      LANE: ${{ inputs.lane }}
      TEAM_ID: BPZ8375UX5
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_PATH: ${{ github.workspace }}/AuthKey.p8
      ASC_RELEASE_TYPE: ${{ vars.ASC_RELEASE_TYPE || 'AFTER_APPROVAL' }}
      SIGNING: manual
      PROFILE_NAME: VELSTRIA AppStore CI
    steps:
      - uses: actions/checkout@v4

      - name: ツール準備
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)"
          xcodebuild -version
          brew install xcodegen

      - name: コアのテスト
        working-directory: VELSTRIA/Packages/VelstriaCore
        run: swift test -c release

      - name: HUD・チュートリアルの単体テストと UI テスト
        run: |
          xcodegen generate --quiet
          mkdir -p build
          xcodebuild test \
            -project VELSTRIA.xcodeproj \
            -scheme VELSTRIA \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -destination-timeout 120 \
            -resultBundlePath build/HUDTests.xcresult \
            -only-testing:VELSTRIATests/HUDTutorialTests \
            -only-testing:VELSTRIATests/HUDMinimapPrecisionTests \
            -only-testing:VELSTRIATests/HUDTacticalMapTests \
            -only-testing:VELSTRIATests/HUDLayoutTests \
            -only-testing:VELSTRIATests/HUDAimTests \
            -only-testing:VELSTRIATests/HUDShopTests \
            -only-testing:VELSTRIATests/HUDAttackTests \
            -only-testing:VELSTRIATests/SettingsScreensTests \
            -only-testing:VELSTRIATests/RenderLogicTests \
            -only-testing:VELSTRIAUITests/HUDTacticalMapUITests \
            -only-testing:VELSTRIAUITests/BattleHUDUITests \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO

      - name: HUD テストのスクリーンショットを書き出す
        if: always()
        continue-on-error: true
        run: |
          if [[ -d build/HUDTests.xcresult ]]; then
            xcrun xcresulttool export attachments \
              --path build/HUDTests.xcresult \
              --output-path build/HUDScreenshots
          fi

      - name: HUD テスト結果とスクリーンショットを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hud-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            VELSTRIA/build/HUDTests.xcresult
            VELSTRIA/build/HUDScreenshots
          if-no-files-found: warn
          retention-days: 14

      - name: 署名の準備
        env:
          CI_DIST_P12_BASE64: ${{ secrets.CI_DIST_P12_BASE64 }}
          CI_DIST_P12_PASSWORD: ${{ secrets.CI_DIST_P12_PASSWORD }}
          CI_PROFILE_BASE64: ${{ secrets.CI_PROFILE_BASE64 }}
        run: tools/ci_signing_setup.sh

      - name: API キーを配置
        working-directory: ${{ github.workspace }}
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          umask 077
          printf '%s\n' "$ASC_KEY_P8" > AuthKey.p8

      - name: アーカイブとアップロード
        # ビルド番号は 2026-01-01 からの経過秒（並行実行でも重複しない）。GITHUB_ENV に BUILD_NUMBER を書く
        run: tools/ci_build_upload.sh

      - name: ビルド処理の完了を待つ
        run: node tools/asc.mjs wait-build "$BUILD_NUMBER"

      - name: TestFlight のテスト内容を記入
        # コミットメッセージは ${{ }} で埋め込まず git から読む（スクリプト注入対策）
        continue-on-error: true
        run: |
          prefix=""
          [[ "$LANE" == "production" ]] && prefix="【App Store 提出ビルド】"$'\n'
          notes="$(printf '%sブランチ: %s\nコミット: %s %s（%s）' "$prefix" "$GITHUB_REF_NAME" "${GITHUB_SHA:0:7}" \
            "$(git log -1 --format=%s)" "$(git log -1 --format=%an)")"
          node tools/asc.mjs beta-notes "$BUILD_NUMBER" "$notes"

      - name: App Store の審査に提出
        if: inputs.lane == 'production'
        run: node tools/asc.mjs submit "$BUILD_NUMBER"

      - name: 結果
        if: success()
        run: |
          {
            echo "### ${LANE} — ビルド ${BUILD_NUMBER}"
            echo "- ブランチ: \`${GITHUB_REF_NAME}\` / コミット: \`${GITHUB_SHA:0:7}\`"
            if [[ "$LANE" == "production" ]]; then
              echo "- App Store の審査に提出済み（公開方法: ${ASC_RELEASE_TYPE}）。TestFlight の内部テストにも届きます"
            else
              echo "- TestFlight の内部テストグループに配信済み"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 後片付け
        if: always()
        run: |
          tools/ci_signing_cleanup.sh || true
          rm -f "${{ github.workspace }}/AuthKey.p8"
