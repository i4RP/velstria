name: Build & Upload

# testflight.yml（production 以外のブランチ）と production.yml（production ブランチ）から呼ばれる共通ジョブ。
# テスト → アーカイブ（手動署名）→ App Store Connect へアップロード → 処理完了待ち →
# 内部テスターへの配信を確認 → TestFlight の「テスト内容」にブランチ・コミットを記入。
# App Store への審査提出・公開は行わない（ユーザー指示: 本番配信は不要。配信先は TestFlight の内部グループだけ）。
#
# 必要な Secrets（呼び出し側から secrets: inherit で渡す）:
#   ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8   App Store Connect API キー（アップロード・ビルド状態の確認）
#   CI_DIST_P12_BASE64 / CI_DIST_P12_PASSWORD  CI 専用の配布証明書（Apple Distribution）と秘密鍵
#   CI_PROFILE_BASE64                         App Store プロビジョニングプロファイル「VELSTRIA AppStore CI」
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: TestFlight 配信
    runs-on: macos-26
    timeout-minutes: 150
    defaults:
      run:
        working-directory: VELSTRIA
    env:
      LANE: beta
      TEAM_ID: BPZ8375UX5
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_PATH: ${{ github.workspace }}/AuthKey.p8
      ASC_INTERNAL_GROUP_ID: 5e0acd82-35c1-4220-a98d-5c1d88370b7c # 既存の内部グループ「In」（全ビルド自動配信）
      SIGNING: manual
      PROFILE_NAME: VELSTRIA AppStore CI
    steps:
      - uses: actions/checkout@v4

      - name: ツール準備
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)"
          xcodebuild -version
          brew install xcodegen

      - name: 配信ツール（asc.mjs）のテスト
        run: node --test tools/asc.test.mjs

      - name: コアのテスト
        working-directory: VELSTRIA/Packages/VelstriaCore
        run: swift test -c release

      - name: HUD・チュートリアル・オンライン対戦・観戦の単体テストと UI テスト
        # GPU の無いランナーは描画が遅く、UI の問い合わせが時間切れになる不安定な失敗が起きる。
        # 落ちたテストだけを最大 3 回まで自動で再実行する（3 回とも落ちれば失敗。網羅は減らさない）
        run: |
          xcodegen generate --quiet
          mkdir -p build
          xcodebuild test \
            -project VELSTRIA.xcodeproj \
            -scheme VELSTRIA \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -destination-timeout 120 \
            -resultBundlePath build/HUDTests.xcresult \
            -only-testing:VELSTRIATests/HUDTutorialTests \
            -only-testing:VELSTRIATests/HUDMinimapPrecisionTests \
            -only-testing:VELSTRIATests/HUDTacticalMapTests \
            -only-testing:VELSTRIATests/HUDLayoutTests \
            -only-testing:VELSTRIATests/HUDAimTests \
            -only-testing:VELSTRIATests/HUDShopTests \
            -only-testing:VELSTRIATests/HUDAttackTests \
            -only-testing:VELSTRIATests/SettingsScreensTests \
            -only-testing:VELSTRIATests/RenderLogicTests \
            -only-testing:VELSTRIATests/OnlineProtocolTests \
            -only-testing:VELSTRIATests/OnlineSessionTests \
            -only-testing:VELSTRIATests/OnlineTransportTests \
            -only-testing:VELSTRIATests/OnlineSpectatorTests \
            -only-testing:VELSTRIATests/SpectatorFoundationTests \
            -only-testing:VELSTRIATests/SpectatorOptionsTests \
            -only-testing:VELSTRIATests/HUDSpectatorTests \
            -only-testing:VELSTRIATests/HUDReplayTransportTests \
            -only-testing:VELSTRIATests/PresentationResetTests \
            -only-testing:VELSTRIATests/SpectatorAudioTests \
            -only-testing:VELSTRIATests/ReplayBakerTests \
            -only-testing:VELSTRIATests/CameraDirectorTests \
            -only-testing:VELSTRIATests/SpectatorCameraTests \
            -only-testing:VELSTRIATests/DeathSpectateTests \
            -only-testing:VELSTRIATests/ReplayLibraryTests \
            -only-testing:VELSTRIATests/SpectateSetupTests \
            -only-testing:VELSTRIAUITests/HUDTacticalMapUITests \
            -only-testing:VELSTRIAUITests/BattleHUDUITests \
            -only-testing:VELSTRIAUITests/SpectatorHUDUITests \
            -only-testing:VELSTRIAUITests/ReplayLibraryUITests \
            -only-testing:VELSTRIAUITests/OnlineSpectateLobbyUITests \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure -test-iterations 3 \
            CODE_SIGNING_ALLOWED=NO

      - name: HUD テストのスクリーンショットを書き出す
        if: always()
        continue-on-error: true
        run: |
          if [[ -d build/HUDTests.xcresult ]]; then
            xcrun xcresulttool export attachments \
              --path build/HUDTests.xcresult \
              --output-path build/HUDScreenshots
          fi

      - name: HUD テスト結果とスクリーンショットを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hud-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            VELSTRIA/build/HUDTests.xcresult
            VELSTRIA/build/HUDScreenshots
          if-no-files-found: warn
          retention-days: 14

      - name: 署名の準備
        env:
          CI_DIST_P12_BASE64: ${{ secrets.CI_DIST_P12_BASE64 }}
          CI_DIST_P12_PASSWORD: ${{ secrets.CI_DIST_P12_PASSWORD }}
          CI_PROFILE_BASE64: ${{ secrets.CI_PROFILE_BASE64 }}
        run: tools/ci_signing_setup.sh

      - name: API キーを配置
        working-directory: ${{ github.workspace }}
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          umask 077
          printf '%s\n' "$ASC_KEY_P8" > AuthKey.p8

      - name: アーカイブとアップロード
        # ビルド番号は 2026-01-01 からの経過秒（並行実行でも重複しない）。GITHUB_ENV に BUILD_NUMBER を書く
        run: tools/ci_build_upload.sh

      - name: ビルド処理の完了を待つ
        run: node tools/asc.mjs wait-build "$BUILD_NUMBER"

      - name: 内部テスターへの配信を確認
        run: node tools/asc.mjs verify-internal "$BUILD_NUMBER"

      - name: TestFlight のテスト内容を記入
        # コミットメッセージは ${{ }} で埋め込まず git から読む（スクリプト注入対策）
        continue-on-error: true
        run: |
          notes="$(printf 'ブランチ: %s\nコミット: %s %s（%s）' "$GITHUB_REF_NAME" "${GITHUB_SHA:0:7}" \
            "$(git log -1 --format=%s)" "$(git log -1 --format=%an)")"
          node tools/asc.mjs beta-notes "$BUILD_NUMBER" "$notes"

      - name: 結果
        if: success()
        run: |
          {
            echo "### TestFlight — ビルド ${BUILD_NUMBER}"
            echo "- ブランチ: \`${GITHUB_REF_NAME}\` / コミット: \`${GITHUB_SHA:0:7}\`"
            echo "- TestFlight の内部テストグループに配信済み"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 後片付け
        if: always()
        run: |
          tools/ci_signing_cleanup.sh || true
          rm -f "${{ github.workspace }}/AuthKey.p8"
