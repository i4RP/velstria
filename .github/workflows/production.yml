name: TestFlight (production)

# production ブランチへの push でも、他のブランチと同じく TestFlight の内部テスト（内部グループ「In」）へ配信する。
# App Store への審査提出・公開は行わない（ユーザー指示: 本番配信は不要。かつて入れていた提出前チェックと審査提出は削除済み）。
# 「テスト内容」にブランチ名とコミットが入る。中身は build-upload.yml（testflight.yml と共通）。
# paths で絞らない（production への push は、変更の中身によらず必ず配信する）。
on:
  push:
    branches: [production]
  workflow_dispatch:

# 同じブランチの待機中の実行は新しい push で置き換わる（実行中のビルドは止めない）
concurrency:
  group: testflight-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  testflight:
    uses: ./.github/workflows/build-upload.yml
    secrets: inherit
